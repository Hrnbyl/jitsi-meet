name: CD - Deploy to AWS EKS

on:
  workflow_dispatch: 
  push:
    branches: [ master ]
    paths:
      - 'jitsi-infra/terraform/**'

jobs:
  deploy-eks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Needed to commit changes back

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install eksctl
        run: |
          curl --silent --location "https://github.com/weaveworks/eksctl/releases/latest/download/eksctl_$(uname -s)_amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin

      - name: Terraform Init
        run: |
          cd jitsi-infra/terraform
          terraform init

      - name: Terraform Apply
        run: |
          cd jitsi-infra/terraform
          terraform apply -auto-approve

      - name: Fetch and Inject ACM Certificate
        run: |
          CERT_ARN=$(aws acm list-certificates --region "ap-south-1" --query "CertificateSummaryList[?DomainName=='meet.hrnbyl.com'] | sort_by(@, &CreatedAt) | [-1].CertificateArn" --output text)
          if [ "$CERT_ARN" != "None" ] && [ -n "$CERT_ARN" ]; then
            sed -i "s|alb.ingress.kubernetes.io/certificate-arn:.*|alb.ingress.kubernetes.io/certificate-arn: $CERT_ARN|g" ./jitsi-infra/helm/jitsi-chart/values.yaml
          fi

      - name: Commit and Push Updated values.yaml to GitHub (For Argo CD)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ./jitsi-infra/helm/jitsi-chart/values.yaml
          git commit -m "Auto-update ACM Certificate ARN in values.yaml" || echo "No changes to commit"
          git push

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --region ap-south-1 --name jitsi-eks-cluster

      - name: Check and Attach IAM Policy
        run: |
          POLICY_ARN=$(aws iam list-policies --query "Policies[?PolicyName=='EKS_Combined_ALB_Route53_Policy'].Arn" --output text)
          if [ -z "$POLICY_ARN" ]; then
              aws iam create-policy --policy-name "EKS_Combined_ALB_Route53_Policy" --policy-document file://jitsi-infra/iam_policy.json
          fi

      - name: Configure OIDC and IAM ServiceAccount
        run: |
          POLICY_ARN=$(aws iam list-policies --query "Policies[?PolicyName=='EKS_Combined_ALB_Route53_Policy'].Arn" --output text)
          eksctl utils associate-iam-oidc-provider --region="ap-south-1" --cluster="jitsi-eks-cluster" --approve
          kubectl delete sa aws-load-balancer-controller -n kube-system 2>/dev/null || true
          eksctl delete iamserviceaccount --cluster="jitsi-eks-cluster" --namespace=kube-system --name=aws-load-balancer-controller 2>/dev/null || true
          eksctl create iamserviceaccount \
              --cluster="jitsi-eks-cluster" \
              --namespace=kube-system \
              --name=aws-load-balancer-controller \
              --role-name AmazonEKSLoadBalancerControllerRole \
              --attach-policy-arn="$POLICY_ARN" \
              --override-existing-serviceaccounts \
              --approve

      - name: Install AWS Load Balancer Controller
        run: |
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
              -n kube-system \
              --set clusterName="jitsi-eks-cluster" \
              --set serviceAccount.create=false \
              --set serviceAccount.name=aws-load-balancer-controller