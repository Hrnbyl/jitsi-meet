name: CD - Deploy to AWS EKS

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches: [ master ]
    paths:
      - 'jitsi-infra/**' # Triggers only when infra/helm files change

jobs:
  deploy-eks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply
        run: |
          cd jitsi-infra/terraform
          terraform init
          terraform apply -auto-approve

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --region ap-south-1 --name jitsi-eks-cluster

      - name: Deploy Helm Chart
        run: |
          helm upgrade --install jitsi-release ./jitsi-infra/helm/jitsi-chart -n jitsi