apiVersion: apps/v1
kind: Deployment
metadata:
  name: jitsi-jicofo
  namespace: jitsi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jitsi-jicofo
  template:
    metadata:
      labels:
        app: jitsi-jicofo
    spec:
      containers:
        - name: jicofo
          image: {{ .Values.images.jicofo }}
          env:
            - name: XMPP_SERVER
              value: "jitsi-prosody"
            - name: XMPP_DOMAIN
              value: {{ .Values.domain }}
            - name: XMPP_AUTH_DOMAIN
              value: {{ .Values.xmpp.authDomain }}
            - name: XMPP_INTERNAL_MUC_DOMAIN
              value: {{ .Values.xmpp.internalMucDomain }}
            - name: JICOFO_COMPONENT_SECRET
              value: {{ .Values.jitsiSecrets.jicofoComponentSecret }}
            - name: JICOFO_AUTH_PASSWORD
              value: {{ .Values.jitsiSecrets.jicofoAuthPassword }}