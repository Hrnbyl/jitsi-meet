# =========================================================
# 1. Network Load Balancer (NLB) for JVB (UDP Port 10000)
# =========================================================
apiVersion: v1
kind: Service
metadata:
  name: jitsi-jvb-nlb
  namespace: jitsi
  annotations:
    service.k8s.aws/type: "nlb"
    service.k8s.aws/nlb-target-type: "ip"
    service.k8s.aws/scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: jitsi-meet
    app.kubernetes.io/component: jvb
  ports:
    - name: jvb-udp
      port: 10000
      targetPort: 10000
      protocol: UDP

---
# =========================================================
# 2. Application Load Balancer (ALB) for Web UI & WebSockets
# =========================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jitsi-ingress
  namespace: jitsi
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jitsi-jitsi-meet-web
                port:
                  number: 80